<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>שיבוץ – מערכת שעות</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-student" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
      <symbol id="i-staff" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5c3 0 5.5 1.6 5.5 4.5"/></symbol>
      <symbol id="i-class" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
      <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="1"/><path d="M3 9h18M9 9v12M15 9v12M8 2v4M16 2v4"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></symbol>
      <symbol id="i-rec" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></symbol>
      <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4M8 14h3"/></symbol>
      <symbol id="i-print" viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="1"/><path d="M6 14h12v7H6z"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></symbol>
    </defs>
  </svg>
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true"></span><b>שיבוץ</b><span id="instName" class="inst"></span></div>
    <div class="top-actions">
      <span id="saveState" class="save-state">נשמר אוטומטית</span>
      <button id="btnUndo" title="ביטול (Ctrl+Z)">ביטול</button>
      <button id="btnRedo" title="שחזור (Ctrl+Y)">שחזור</button>
      <button id="btnBackup" title="הורדת קובץ גיבוי של כל הנתונים">גיבוי</button>
    </div>
  </header>
  <div class="layout">
    <nav class="sidebar" id="nav">
      <a data-page="dashboard"><svg class="ic"><use href="#i-home"/></svg>לוח בקרה</a>
      <div class="nav-sec">נתונים</div>
      <a data-page="students"><svg class="ic"><use href="#i-student"/></svg>תלמידים</a>
      <a data-page="staff"><svg class="ic"><use href="#i-staff"/></svg>צוות ומטפלים</a>
      <a data-page="classes"><svg class="ic"><use href="#i-class"/></svg>כיתות</a>
      <a data-page="activities"><svg class="ic"><use href="#i-list"/></svg>פעילויות ודרישות</a>
      <a data-page="import"><svg class="ic"><use href="#i-import"/></svg>ייבוא מקבצים</a>
      <div class="nav-sec">שיבוץ</div>
      <a data-page="board"><svg class="ic"><use href="#i-grid"/></svg>לוח שיבוץ</a>
      <a data-page="check"><svg class="ic"><use href="#i-search"/></svg>בדיקת זמן</a>
      <a data-page="recs"><svg class="ic"><use href="#i-rec"/></svg>המלצות טיפול</a>
      <a data-page="calendar"><svg class="ic"><use href="#i-cal"/></svg>שינויים ואירועים</a>
      <div class="nav-sec">הפקה</div>
      <a data-page="export"><svg class="ic"><use href="#i-print"/></svg>הפקת מערכות</a>
      <a data-page="reports"><svg class="ic"><use href="#i-chart"/></svg>דוחות</a>
      <div class="nav-sec">מערכת</div>
      <a data-page="settings"><svg class="ic"><use href="#i-gear"/></svg>הגדרות</a>
      <a data-page="help"><svg class="ic"><use href="#i-help"/></svg>מדריך</a>
    </nav>
    <main id="main"></main>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>

  <script src="js/vendor/xlsx.full.min.js"></script>
  <script src="js/vendor/jszip.min.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/model.js"></script>
  <script src="js/views.js"></script>
  <script src="js/render.js"></script>
  <script src="js/importer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages-data.js"></script>
  <script src="js/pages-board.js"></script>
  <script src="js/pages-tools.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
